name: Docker Build

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ${{ vars.SERV == 'nekocwd' && 'neko-docker' || 'als-tiny' }}
    container:
      image: altlinux.space/actions/runner/containers:sisyphus

    steps:
      - name: Compute image name
        shell: sh
        run: |
          REGISTRY=$(echo '${{ forge.server_url }}' | sed -E 's#^\s*[a-z]+://##')
          USER=$(echo '${{ forge.repository_owner }}' | awk '{print tolower($0)}')
          REPO=$(echo '${{ forge.repository }}' | awk '{print tolower($0)}')
          echo "IMAGE=$REGISTRY/$USER/$REPO:latest" >> "$GITHUB_ENV"
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        run: |
          podman login --username="<token>" --password="${{ secrets.PACKAGE_TOKEN }}" "${{ env.REGISTRY }}"

      - name: Build tester image
        run: |
          podman build \
            -t "$IMAGE" \
            -f Dockerfile.altlinux .

      - name: Push tester image
        run: |
          podman push "$IMAGE"
